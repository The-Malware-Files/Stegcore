[package]
name = "stegcore-tauri"
version = "4.1.0"
description = "Stegcore desktop application; Tauri v2 backend"
authors = ["The Malware Files <ops@themalwarefiles.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/The-Malware-Files/Stegcore"
edition = "2021"
rust-version = "1.77.2"
publish = false

[[bin]]
name = "stegcore-gui"
path = "src/main.rs"

[lib]
name = "stegcore_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stegcore-core = { path = "../crates/core", version = "4.1.0" }

# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
# The float_roundtrip feature is not optional for this project. Without it,
# serde_json's default parser is a fast approximation that can land one unit in
# the last place away from the value that was written: measured, 10.6% of f64
# values in [0, 1) came back changed, which is most of the score range in an
# analysis report. The writer was never the problem (it emits the shortest
# decimal that round trips, and Python and JavaScript both read it back exactly),
# so this changes no output bytes and no stored report. It makes OUR reader as
# accurate as everyone else's.
serde_json = { version = "1", features = ["float_roundtrip"] }

# Logging
log = "0.4"

# Image (for pixel diff)
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }

# Parallelism
rayon = "1"

[dev-dependencies]
# Integration tests in tests/commands.rs use tempdirs to isolate the
# Tauri AppHandle's config_dir.
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
