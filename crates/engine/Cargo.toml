[package]
name = "stegcore-engine"
version = "4.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Stegcore steganography engine: adaptive LSB, JPEG DCT, WAV PCM, deniable dual-payload, Aletheia-parity SPA / RS / WS steganalysis."
license = "AGPL-3.0-or-later"
repository = "https://github.com/The-Malware-Files/Stegcore"
homepage = "https://github.com/The-Malware-Files/Stegcore"
authors = ["The Malware Files <ops@themalwarefiles.com>"]
readme = "../../README.md"
keywords = ["steganography", "steganalysis", "lsb", "cryptography", "aletheia"]
categories = ["cryptography", "multimedia::images", "multimedia::audio", "multimedia::encoding"]

[lib]
name = "stegcore_engine"
crate-type = ["lib"]

[features]
default = []
# Capture fixtures for the covert-channel detector's measurement harness. Off by
# default so a published library ships no traffic generator, however constrained.
# The crate's own tests compile the module regardless; see covert/mod.rs.
covert-fixtures = []

[dependencies]
ascon-aead       = "0.4"
chacha20poly1305 = "0.10"
aes-gcm          = "0.10"
argon2           = "0.5"
# Compression. lz4_flex writes, ruzstd reads anything written before the
# 2026-08-20 wire-format change. Both are pure Rust: this is what removes the
# last C dependency from the engine (T-30). Versions chosen past the Section 5
# cooldown, both MIT.
lz4_flex         = { version = "0.13", default-features = false, features = ["std"] }
ruzstd           = "0.8"

# Keeping key material out of swap and out of core dumps (mlock, prctl).
# Bindings to the platform C library, not vendored C.
libc             = "0.2"
dct-io           = "0.1"
image            = { version = "0.25", features = ["png", "bmp", "jpeg", "webp"] }
# Direct use of the low-level PNG encoder (already in the tree via `image`)
# so we can control compression and preserve ancillary chunks, which
# image's high-level writer does not expose.
png              = "0.17"
hound            = "3.5"
flac-io          = "0.1"
bitvec           = "1"
rand             = "0.8"
rand_chacha      = "0.3"
serde            = { version = "1", features = ["derive"] }
# The float_roundtrip feature is not optional for this project. Without it,
# serde_json's default parser is a fast approximation that can land one unit in
# the last place away from the value that was written: measured, 10.6% of f64
# values in [0, 1) came back changed, which is most of the score range in an
# analysis report. The writer was never the problem (it emits the shortest
# decimal that round trips, and Python and JavaScript both read it back exactly),
# so this changes no output bytes and no stored report. It makes OUR reader as
# accurate as everyone else's.
serde_json = "1"
base64           = "0.22"
thiserror        = "1"
zeroize          = { version = "1", features = ["derive"] }
tempfile         = "3"
statrs           = "0.17"
# The pipeline file format. Already resolved in this workspace's lockfile at the
# same 0.8 line the CLI uses, so this adds no new transitive surface: it reuses
# a crate the tree already builds.
toml             = "0.8"
rayon            = "1"
bumpalo          = "3"

[dev-dependencies]
# Property-based testing for engine invariants — Track B of the
# adversarial test gate. Pinned cases run in CI; the shrinking + random
# space runs locally.
proptest = "1"

# Timing-oracle measurement (threat E). Dev-only, never shipped: criterion
# pulls a large tree and none of it reaches the binary. 0.8.2 published
# 2026-02-04, well past the Section 5 cooldown; Apache-2.0 OR MIT.
criterion = "0.8"

# Threat E: is extraction's timing independent of the passphrase and of
# whether a payload is present at all? `harness = false` because criterion
# supplies its own main.
[[bench]]
name = "timing_oracle"
harness = false

# The measurement harness for the covert-channel detector. Needs the fixtures,
# so it is only built when they are enabled.
[[example]]
name = "covert_measure"
required-features = ["covert-fixtures"]
