[package]
name = "stegcore-core"
version = "4.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Stegcore public wrapper: engine bindings, report types, and the dispatcher both the CLI and the Tauri GUI consume."
license = "AGPL-3.0-or-later"
repository = "https://github.com/The-Malware-Files/Stegcore"
homepage = "https://github.com/The-Malware-Files/Stegcore"
authors = ["The Malware Files <ops@themalwarefiles.com>"]
readme = "../../README.md"
keywords = ["steganography", "steganalysis", "encryption", "privacy"]
categories = ["cryptography", "multimedia::images", "multimedia::audio"]

[lib]
name = "stegcore_core"
crate-type = ["rlib"]

[dependencies]
# Engine (sibling workspace crate)
stegcore-engine = { path = "../engine", version = "4.1.0" }

# Serialisation
serde = { version = "1", features = ["derive"] }
# The float_roundtrip feature is not optional for this project. Without it,
# serde_json's default parser is a fast approximation that can land one unit in
# the last place away from the value that was written: measured, 10.6% of f64
# values in [0, 1) came back changed, which is most of the score range in an
# analysis report. The writer was never the problem (it emits the shortest
# decimal that round trips, and Python and JavaScript both read it back exactly),
# so this changes no output bytes and no stored report. It makes OUR reader as
# accurate as everyone else's.
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"

# Error types
thiserror = "1"

# Temp files
tempfile = "3"

# Platform config-directory resolution (shared watermarking consent marker)
dirs = "6"

# Document watermark carriers. Minimal feature sets: lopdf with no date/parallel
# extras, zip with a single deflate backend (no bzip2/zstd/aes/lzma codecs).
lopdf = { version = "0.42.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

# Logging
log = "0.4"

# Parallelism
rayon = "1"

[dev-dependencies]
# Property-based adversarial tests over the document watermark parsers.
proptest = "1"
