# --- Exports -----------------------------------------------------------------
#
# Both needles come from `export_onnx.py`'s own final line, after the round-trip
# assertion and the card write. See the note in `train-yedroudj.toml`; do not
# "fix" the plan warning by echoing them.

[[job]]
id = "export_srnet_spatial"
name = "export SRNet spatial to ONNX with its model card"
machine = "rented"
kind = "shell"
deps = ["srnet_spatial_010"]
command = '''cd /workspace/detego-ml && python export_onnx.py \
  --checkpoint /workspace/runs/srnet-spatial-010/best.pt \
  --out-dir /workspace/artefacts --name srnet-spatial-v1 \
  --architecture srnet --domain spatial --side 256 \
  --eval-report /workspace/runs/srnet-spatial-010/report.json \
  --envelope /workspace/runs/srnet-spatial-010/envelope.json \
  --calibration /workspace/runs/srnet-spatial-010/calibration.json \
  --verify-batch /workspace/runs/srnet-spatial-010/verify-batch.npy'''
timeout_secs = 1800
[job.success]
type = "stdout-contains"
needle = "EXPORT_OK_srnet-spatial-v1"
[job.resources]
ram_gb = 8
needs_disk_gb = 2
stall_secs = 600
[job.liveness]
blocked_secs = 600

[[job]]
id = "export_srnet_jpeg"
name = "export SRNet JPEG DCT to ONNX with its model card"
