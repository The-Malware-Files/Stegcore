# --- JPEG curriculum ----------------------------------------------------------
#
# THIS IS THE CAPABILITY THE RELEASE IS FOR. The measured blind spot is JPEG:
# 0 of 120 steghide verdicts changed, median delta 0.0000. Everything above is
# an improvement on a surface that already works; this is the surface that does
# not.
#
# Payload rates are in bits per non-zero AC coefficient, not bits per pixel,
# because that is the unit JPEG embedding capacity is measured in and conflating
# the two silently changes what the arm means.
#
# DEPENDENCY ON ANOTHER WORKER: the `jpeg_dct_dequantised` domain needs the
# quantisation tables, which `dct-io` 0.1.1 does not expose (filed as its D2).
# These jobs therefore run against `jpeg_dct_quantised`, which works today, and
# the model card will say so. Quantised coefficients are only comparable within
# one quality setting, so `--stratify-quality` is not optional here: without it
# the model can learn the compressor rather than the payload, which is exactly
# the failure we measured in a vendor's detector (its score followed the JPEG
# writer, scoring an altered file cleaner than its own original in 89.6% of
# pairs).

[[job]]
id = "srnet_jpeg_040"
name = "SRNet JPEG DCT, 0.4 bpnzac, from scratch (curriculum stage 1)"
machine = "rented"
kind = "shell"
deps = ["fetch_corpora_full"]
command = '''cd /workspace/detego-ml && python train.py \
  --architecture srnet --domain jpeg_dct_quantised \
  --train-sources alaska2,pentimento --test-sources reveal \
  --embedders steghide,outguess,j-uniward --rates 0.4 \
  --stratify-quality --epochs 120 --crop 256 --batch 16 \
  --out /workspace/runs/srnet-jpeg-040 && echo TRAIN_OK_srnet_jpeg_040'''
timeout_secs = 43200
[job.success]
type = "stdout-contains"
needle = "TRAIN_OK_srnet_jpeg_040"
[job.resources]
needs_gpu = true
ram_gb = 24
needs_disk_gb = 20
stall_secs = 2400
[job.liveness]
blocked_secs = 2400

[[job]]
id = "srnet_jpeg_020"
name = "SRNet JPEG DCT, 0.2 bpnzac, seeded from 0.4 (curriculum stage 2)"
machine = "rented"
kind = "shell"
deps = ["srnet_jpeg_040"]
command = '''cd /workspace/detego-ml && python train.py \
